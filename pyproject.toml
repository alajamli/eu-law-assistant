[project]
name = "eu-law-assistant"
version = "0.1.0"
description = "Bilingual (EN/FR) RAG assistant over EU legislation with citations, refusal and a measured evaluation harness."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "numpy>=1.26",
    "lxml>=5.2",
    "tenacity>=8.5",
]

[project.optional-dependencies]
# Heavy ML dependencies. Kept out of the default install so CI stays fast and
# small; the embedding/reranking stages import them lazily.
ml = [
    "sentence-transformers>=3.0",
    "torch>=2.3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "ingest*", "retrieval*", "evals*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["api", "ingest", "retrieval", "evals"]
